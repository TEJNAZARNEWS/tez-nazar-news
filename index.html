<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>तेज़ नज़र न्यूज़</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans Devanagari',sans-serif;margin:0;background:#f5f6f8;color:#20242a}header{background:#b80019;color:white;padding:18px;text-align:center}header h1{margin:0;font-size:27px}nav{background:#242424;color:white;padding:12px;text-align:center}.wrap{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #0001}input,textarea,button{font:inherit;width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px}textarea{min-height:115px}button{background:#b80019;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hidden{display:none}.muted{color:#666}.story{border-bottom:1px solid #ddd;padding:12px 0}.story:last-child{border:0}.story h3{margin:0 0 6px}.story p{white-space:pre-wrap;overflow-wrap:anywhere}#message{min-height:24px;color:#a00015}small{color:#555}
</style>
</head>
<body>
<header><h1>तेज़ नज़र न्यूज़</h1><div>TEZ NAZAR NEWS | जनता की आवाज़</div></header>
<nav>ताज़ा खबरें • गिरिडीह • झारखंड</nav>
<main class="wrap">
<section class="panel"><h2>ताज़ा खबरें</h2><div id="stories">खबरें लोड हो रही हैं…</div></section>
<section class="panel" id="loginPanel"><h2>रिपोर्टर लॉगिन</h2><form id="loginForm"><input id="email" type="email" placeholder="रिपोर्टर ईमेल" autocomplete="username" required><input id="password" type="password" placeholder="पासवर्ड" autocomplete="current-password" required><button id="loginBtn" type="submit">लॉगिन करें</button></form></section>
<section class="panel hidden" id="reporterPanel"><h2>रिपोर्टर डैशबोर्ड</h2><p id="reporterName"></p><button id="logoutBtn" type="button">लॉगआउट</button><h3>नई खबर प्रकाशित करें</h3><form id="newsForm"><input id="headline" maxlength="160" placeholder="खबर का शीर्षक" required><textarea id="body" maxlength="10000" placeholder="खबर का विवरण" required></textarea><button id="publishBtn" type="submit">खबर प्रकाशित करें</button></form></section>
<section class="panel"><p id="message" role="status" aria-live="polite"></p><small>केवल अधिकृत रिपोर्टर खबर प्रकाशित कर सकते हैं।</small></section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore,collection,addDoc,query,orderBy,limit,onSnapshot,serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
// Firebase Console > Project settings > Your apps > Web app से अपनी config यहाँ डालें।
const firebaseConfig = {
  apiKey: 'PASTE_API_KEY',
  authDomain: 'PASTE_PROJECT_ID.firebaseapp.com',
  projectId: 'PASTE_PROJECT_ID',
  storageBucket: 'PASTE_PROJECT_ID.firebasestorage.app',
  messagingSenderId: 'PASTE_MESSAGING_SENDER_ID',
  appId: 'PASTE_APP_ID'
};
const $=id=>document.getElementById(id), message=text=>$('message').textContent=text;
const configured=!Object.values(firebaseConfig).some(v=>v.includes('PASTE_'));
if(!configured){$('stories').textContent='Firebase सेटअप पूरा होने पर खबरें यहाँ दिखेंगी।';message('पहले Firebase Config भरें।');}
else {
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
onAuthStateChanged(auth,user=>{
 $('loginPanel').classList.toggle('hidden',!!user);
 $('reporterPanel').classList.toggle('hidden',!user);
 $('reporterName').textContent=user?`लॉगिन: ${user.email}`:'';
});
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();$('loginBtn').disabled=true;message('लॉगिन हो रहा है…');
 try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';message('लॉगिन सफल।');}
 catch(err){message('लॉगिन नहीं हुआ। ईमेल, पासवर्ड और Firebase सेटिंग जाँचें।');}
 finally{$('loginBtn').disabled=false;}
});
$('logoutBtn').addEventListener('click',async()=>{try{await signOut(auth);message('लॉगआउट सफल।');}catch(e){message('लॉगआउट नहीं हुआ।');}});
$('newsForm').addEventListener('submit',async e=>{
 e.preventDefault();const user=auth.currentUser;if(!user){message('पहले लॉगिन करें।');return;}
 $('publishBtn').disabled=true;
 try{await addDoc(collection(db,'news'),{title:$('headline').value.trim(),body:$('body').value.trim(),authorUid:user.uid,authorEmail:user.email,createdAt:serverTimestamp()});$('newsForm').reset();message('खबर प्रकाशित हो गई।');}
 catch(err){message('खबर सेव नहीं हुई। Firestore नियम और अनुमति जाँचें।');}
 finally{$('publishBtn').disabled=false;}
});
onSnapshot(query(collection(db,'news'),orderBy('createdAt','desc'),limit(50)),snapshot=>{
 $('stories').replaceChildren();if(snapshot.empty){$('stories').textContent='अभी कोई खबर प्रकाशित नहीं हुई है।';return;}
 snapshot.forEach(doc=>{const n=doc.data(),item=document.createElement('article'),title=document.createElement('h3'),body=document.createElement('p'),date=document.createElement('small');item.className='story';title.textContent=n.title||'';body.textContent=n.body||'';date.textContent=n.createdAt?.toDate?.().toLocaleString('hi-IN')||'';item.append(title,date,body);$('stories').append(item);});
},err=>{$('stories').textContent='खबरें नहीं खुल सकीं। Firestore सेटअप जाँचें।';});
}
</script>
</body>
</html>
